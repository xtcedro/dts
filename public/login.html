<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure admin login portal for Dominguez Tech Solutions. Access the dashboard and manage your AI-powered systems with confidence.">
  <meta name="keywords" content="Admin Login, Dominguez Tech Solutions, AI Dashboard, HOPS Framework, Secure Portal">
  <meta name="author" content="Pedro Dominguez">
  <meta property="og:title" content="Admin Login | Dominguez Tech Solutions">
  <meta property="og:description" content="Log into the secure Dominguez Tech Solutions dashboard to manage AI tools, appointments, and automation settings.">
  <meta property="og:image" content="assets/images/crash-course.png">
  <meta property="og:url" content="https://www.domingueztechsolutions.com/login.html">
  <meta name="twitter:card" content="summary_large_image">
  <title>Admin Login | Dominguez Tech Solutions</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script type="module" src="assets/js/script.js"></script>
</head>
<body>
  <nav class="navbar"></nav>

  <section class="hero">
    <img src="assets/images/banner.png" alt="Admin Login Portal" class="hero-banner" />
    <h1>Admin Login Portal 🔐</h1>
    <p>Access the dashboard to manage your AI tools, appointments, and automation systems.</p>

  <section class="login-form-section">
    <div class="form-container">
      <form id="loginForm" class="admin-login-form">
        <h2>Administrator Access</h2>
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <p id="loginMessage" class="login-message"></p>
      </form>
    </div>
  </section>

  <section class="contact">
    <h2>Need Help Logging In? 🆘</h2>
    <a href="contact.html" class="cta-button">Contact Support 📞</a>
  </section>

  <footer id="footer"></footer>
