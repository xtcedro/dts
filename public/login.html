<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Dominguez Tech Solutions Admin Login">
  <title>Admin Login | Dominguez Tech Solutions</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script type="module" src="assets/js/script.js"></script>
</head>
<body>
  <nav class="navbar"></nav>

  <main>
    <section class="hero">
      <img src="assets/images/banner.png" alt="Dominguez Tech Solutions Banner" class="hero-banner" />
      <h1>🔐 Admin Login</h1>
      <p>Secure access to manage appointments, chat history, and operations.</p>
    </section>

    <section class="login-section">
      <form id="admin-login-form" class="login-form">
        <label for="username">👤 Username</label>
        <input type="text" id="username" name="username" placeholder="Enter admin username" required />

        <label for="password">🔒 Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required />

        <button type="submit">🔓 Login</button>
        <p id="login-message"></p>
      </form>
    </section>
  </main>

  <footer id="footer"></footer>

  <script type="module">
    document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("login-message");

      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          message.textContent = `❌ ${data.error || "Login failed"}`;
          message.style.color = "red";
        } else {
          message.textContent = "✅ Login successful!";
          message.style.color = "green";
          localStorage.setItem("admin_token", data.token);
          setTimeout(() => location.href = "admin-dashboard.html", 1000);
        }
      } catch (err) {
        message.textContent = "❌ Server error. Try again later.";
        message.style.color = "red";
      }
    });
  </script>
</body>
</html>
