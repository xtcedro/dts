<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book appointments for tech services—AI courses, repairs, web apps, and IT consulting—no registration required!">
  <title>Public Appointment Booker – No Registration Needed</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/script.js"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar"></nav>

  <!-- Hero Section -->
  <section class="hero">
    <h2>📅 Public Appointment Booker – No Registration Required! 🚀</h2>
    <p>
      Need tech services? Book your appointment online in seconds—no signup required!
      Choose from AI training, repairs, web development, and IT consultation.
    </p>
    <p class="urgent">💡 Secure your spot now for expert tech solutions! ⚡</p>
  </section>

  <!-- Main Content -->
  <main>
    <!-- Appointment Booker Section -->
    <section class="appointment-booker">
      <form id="appointmentForm" action="/submit-appointment" method="POST" class="appointment-form">

        <div class="form-group">
          <label for="name">👤 Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="phone">📞 Your Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
          <label for="email">📧 Your Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
          <label for="service">🛠️ Choose a Service</label>
          <select id="service" name="service" required>
            <option value="" disabled selected>🔽 Select a service</option>
            <option value="crash-course">📚 AI & Web Dev Crash Course ($69)</option>
            <option value="computer-repair">💻 Mobile & Computer Repair (Varies)</option>
            <option value="web-app">🌐 Custom Web Application Development</option>
            <option value="it-consultation">🧑‍💻 IT Consultation</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">📝 Additional Details</label>
          <textarea id="message" name="message" rows="4" placeholder="Provide any additional details or questions!" required></textarea>
        </div>

        <!-- Response Message Display -->
        <div id="responseMessage" class="response-message" style="display: none;"></div>

        <button type="submit" class="btn">📅 Book Your Appointment Now</button>
      </form>
    </section>

  </main>

  <!-- Footer Section -->
  <footer id="footer"></footer>

</body>
</html>
